services:
  - type: web
    name: marina-smile-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: SUPABASE_URL
        value: https://lpsjfkyixoubhrryaadk.supabase.co

      - key: SUPABASE_SECRET_KEY
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/google-service-account.json

      - key: DASHBOARD_ALLOWED_ORIGINS
        value: https://marinasmileai-receptionist.vercel.app

      - key: DASHBOARD_APPLICATION_URL
        value: https://marinasmileai-receptionist.vercel.app

      - key: DEMO_ENABLED
        value: "true"

      - key: DEMO_API_TOKEN
        sync: false

      - key: RAG_MATCH_THRESHOLD
        value: "0.60"
